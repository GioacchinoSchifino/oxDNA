name: ANM ES CPU-first (PR236 integration)
on:
  push:
    branches:
      - feature/anm-es-pr236-cpu-first-20261119
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU
        run: |
          cmake -S . -B build -DCUDA=OFF
          cmake --build build -j2
      - name: "CPU ES smoke: legacy and new topology"
        run: python3 test/DNANM/protein_electrostatics/test_cpu_smoke.py --binary build/bin/oxDNA
      - name: CPU ES analytical force and torque tests
        run: python3 test/DNANM/protein_electrostatics/test_pair_physics.py --binary build/bin/oxDNA
      - name: Upstream quick regression
        run: cmake --build build --target test_quick -j2

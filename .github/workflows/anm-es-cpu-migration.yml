name: ANM electrostatics CPU migration validation

on:
  push:
    branches:
      - feature/anm-electrostatics-pr236-cpu-20261119
  workflow_dispatch:

jobs:
  cpu-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU
        run: cmake -S . -B build -DCUDA=OFF
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Existing quick regression
        run: cmake --build build --target test_quick
      - name: Screened protein electrostatics analytical regression
        run: |
          OXDNA_BIN="$PWD/build/bin/oxDNA" python3 -m unittest \
            discover -s test/DNANM/protein_electrostatics \
            -p 'test_analytical_physics_core.py' -v
